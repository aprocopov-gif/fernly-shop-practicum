name: PR triage

on:
  pull_request:
    types: [opened, synchronize, labeled]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-triage-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Merge base into PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${{ github.event.pull_request.base.ref }}"
          git merge --no-edit "origin/${{ github.event.pull_request.base.ref }}"

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Write test plan
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          agent -p --force --trust --output-format text \
            "Use the change-triage subagent on this pull request. The diff is git diff origin/${BASE_REF}...HEAD. Write the plan to docs/test-plans/${BRANCH}.md and print only the plan." \
            > plan.md

      - name: Commit and push test plan
        run: |
          mkdir -p docs/test-plans
          git add "docs/test-plans/${{ github.event.pull_request.head.ref }}.md"
          if git diff --staged --quiet; then
            echo "No test plan file to commit."
          else
            git commit -m "Add test plan for ${{ github.event.pull_request.head.ref }}"
            git push
          fi

      - name: Comment plan on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file plan.md

  tests:
    if: github.event.action == 'labeled' && github.event.label.name == 'plan-approved'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Merge base into PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${{ github.event.pull_request.base.ref }}"
          git merge --no-edit "origin/${{ github.event.pull_request.base.ref }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run approved plan (tests and results)
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          agent -p --force --trust --output-format text \
            "The plan is approved. Route each row to its specialist, write the tests, run them, and write the results file. Never change app code." \
            > results.md

      - name: Commit and push tests and docs
        run: |
          git add tests web/cypress docs/test-plans FINDINGS.md
          if git diff --staged --quiet; then
            echo "No test or doc changes to commit."
          else
            git commit -m "Add tests from approved plan (${{ github.event.pull_request.head.ref }})"
            git push
          fi

      - name: Comment results on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file results.md
